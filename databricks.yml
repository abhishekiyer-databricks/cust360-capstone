# DABs bundle root — Customer 360 capstone.
# T8-min: minimal bundle with a git-source app. Variables + more resources
# (forward-ETL job, declarative synced tables) grow through T6-T8.
bundle:
  name: customer360

variables:
  git_repo_url:
    description: HTTPS URL of the git repo the app pulls source from
    default: https://github.com/abhishekiyer-databricks/cust360-capstone
  git_branch:
    description: Branch the git-source app tracks
    default: main

include:
  - resources/*.yml

# The built React bundle lands in app/backend/static/, which .gitignore excludes (we don't
# want build artifacts in git during dev). But `bundle deploy` sync respects .gitignore, so
# without this the SPA wouldn't upload and the deployed app would 404 the UI (T3 D6). Force
# the built static dir into the deploy upload. (In T8/git-source we instead commit the bundle.)
sync:
  include:
    - app/backend/static/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
